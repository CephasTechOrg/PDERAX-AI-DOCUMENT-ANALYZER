services:
  - type: web
    name: ai-pdf-analyzer-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-max-requests 50 --limit-concurrency 2

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3   # ✅ must include major.minor.patch
      - key: PIP_ROOT_USER_ACTION
        value: ignore
      - key: UVICORN_WORKERS
        value: 1   # keep memory footprint low on free plan
      - key: MISE_PYTHON_COMPILE
        value: "false"   # ✅ helps avoid Rust build issues
