<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History — PDERAX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/history.css">
</head>

<body>
    <div class="container">
        <div class="animated-bg">
            <div class="floating-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
                <div class="shape shape-4"></div>
                <div class="shape shape-5"></div>
            </div>
            <div class="particles" id="particles"></div>
        </div>

        <!-- Navigation injected by nav.js -->
        <div id="nav-root"></div>

        <div class="history-section">

            <!-- Page Header -->
            <div class="history-page-header">
                <h1>Your History</h1>
                <p>All your analysed documents and generated study sets in one place.</p>
            </div>

            <!-- Tabs -->
            <div class="history-tabs">
                <button class="history-tab-btn active" data-tab="analyses" onclick="switchTab('analyses')">
                    <i class="fas fa-file-alt"></i> Analyses
                    <span class="count-badge" id="analyses-count">0</span>
                </button>
                <button class="history-tab-btn" data-tab="flashcards" onclick="switchTab('flashcards')">
                    <i class="fas fa-layer-group"></i> Flashcard Sets
                    <span class="count-badge" id="flashcards-count">0</span>
                </button>
            </div>

            <!-- Analyses panel -->
            <div class="history-panel active" id="panel-analyses">
                <div class="section-header">
                    <h2>Document Analyses</h2>
                </div>
                <div id="analyses-list">
                    <div class="state-box">
                        <i class="fas fa-circle-notch fa-spin"></i>
                        <p>Loading your analyses…</p>
                    </div>
                </div>
            </div>

            <!-- Flashcards panel -->
            <div class="history-panel" id="panel-flashcards">
                <div class="section-header">
                    <h2>Flashcard Sets</h2>
                </div>
                <div id="flashcards-list">
                    <div class="state-box">
                        <i class="fas fa-circle-notch fa-spin"></i>
                        <p>Loading your flashcard sets…</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="nav.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!AuthService.requireAuth()) return;
            AuthService.updateNavForAuthenticatedUser();
            await loadAll();
        });

        function switchTab(tab) {
            document.querySelectorAll('.history-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            document.querySelectorAll('.history-panel').forEach(p => p.classList.toggle('active', p.id === `panel-${tab}`));
        }

        async function loadAll() {
            await Promise.all([loadAnalyses(), loadFlashcards()]);
        }

        // ── Analyses ──────────────────────────────────────────────────────────

        async function loadAnalyses() {
            const el = document.getElementById('analyses-list');
            try {
                const analyses = await window.apiService.getAnalysisHistory();
                document.getElementById('analyses-count').textContent = analyses.length;

                if (!analyses.length) {
                    el.innerHTML = `
                        <div class="state-box">
                            <i class="fas fa-file-alt"></i>
                            <p>No analyses yet. <a href="../index.html">Analyze a document</a> to get started.</p>
                        </div>`;
                    return;
                }

                el.innerHTML = `<div class="history-list">${analyses.map(renderAnalysis).join('')}</div>`;
            } catch (err) {
                el.innerHTML = `
                    <div class="state-box">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Failed to load analyses: ${err.message}</p>
                    </div>`;
            }
        }

        function renderAnalysis(a) {
            const date = new Date(a.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            const words = a.word_count ? `${a.word_count.toLocaleString()} words` : '';
            const summary = a.analysis?.summary ? a.analysis.summary.slice(0, 200) : '';

            return `
                <div class="history-card" id="analysis-${a.id}">
                    <div class="history-card-icon analysis"><i class="fas fa-file-alt"></i></div>
                    <div class="history-card-body">
                        <div class="history-card-title">${escHtml(a.filename)}</div>
                        <div class="history-card-meta">
                            <span><i class="fas fa-calendar-alt"></i> ${date}</span>
                            ${words ? `<span><i class="fas fa-align-left"></i> ${words}</span>` : ''}
                        </div>
                        ${summary ? `<div class="analysis-summary">${escHtml(summary)}…</div>` : ''}
                    </div>
                    <div class="history-card-actions">
                        <button class="btn-icon" title="Load into study tools" onclick="loadAnalysisToStudy('${a.id}')">
                            <i class="fas fa-bolt"></i>
                        </button>
                        <button class="btn-icon danger" title="Delete" onclick="deleteAnalysis('${a.id}')">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>`;
        }

        async function loadAnalysisToStudy(id) {
            try {
                const analyses = await window.apiService.getAnalysisHistory();
                const a = analyses.find(x => x.id === id);
                if (!a) return;
                const ctx = {
                    filename: a.filename,
                    summary: a.analysis?.summary || '',
                    insights: a.analysis?.insights || [],
                    questions_answers: a.analysis?.questions_answers || [],
                    analysis_id: a.id,
                };
                sessionStorage.setItem('flashcard_document', JSON.stringify(ctx));
                window.location.href = 'study-tools.html';
            } catch (err) {
                alert('Could not load analysis: ' + err.message);
            }
        }

        async function deleteAnalysis(id) {
            if (!confirm('Delete this analysis? This will also remove any linked flashcard sets.')) return;
            try {
                await window.apiService.deleteAnalysis(id);
                document.getElementById(`analysis-${id}`)?.remove();
                const list = document.getElementById('analyses-list').querySelector('.history-list');
                if (list && !list.children.length) {
                    document.getElementById('analyses-list').innerHTML = `
                        <div class="state-box">
                            <i class="fas fa-file-alt"></i>
                            <p>No analyses yet. <a href="../index.html">Analyze a document</a> to get started.</p>
                        </div>`;
                }
                const count = document.getElementById('analyses-count');
                count.textContent = Math.max(0, parseInt(count.textContent) - 1);
            } catch (err) {
                alert('Delete failed: ' + err.message);
            }
        }

        // ── Flashcard sets ────────────────────────────────────────────────────

        async function loadFlashcards() {
            const el = document.getElementById('flashcards-list');
            try {
                const sets = await window.apiService.getFlashcardHistory();
                document.getElementById('flashcards-count').textContent = sets.length;

                if (!sets.length) {
                    el.innerHTML = `
                        <div class="state-box">
                            <i class="fas fa-layer-group"></i>
                            <p>No flashcard sets yet. <a href="study-tools.html">Generate flashcards</a> to get started.</p>
                        </div>`;
                    return;
                }

                el.innerHTML = `<div class="history-list">${sets.map(renderFlashcardSet).join('')}</div>`;
            } catch (err) {
                el.innerHTML = `
                    <div class="state-box">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Failed to load flashcard sets: ${err.message}</p>
                    </div>`;
            }
        }

        function renderFlashcardSet(s) {
            const date = new Date(s.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            const title = s.title || 'Untitled flashcard set';
            const diffClass = `badge-${s.difficulty}`;

            return `
                <div class="history-card" id="flashcard-set-${s.id}">
                    <div class="history-card-icon flashcard"><i class="fas fa-layer-group"></i></div>
                    <div class="history-card-body">
                        <div class="history-card-title">${escHtml(title)}</div>
                        <div class="history-card-meta">
                            <span><i class="fas fa-calendar-alt"></i> ${date}</span>
                            <span><i class="fas fa-clone"></i> ${s.card_count} cards</span>
                            <span class="badge ${diffClass}">${s.difficulty}</span>
                        </div>
                    </div>
                    <div class="history-card-actions">
                        <button class="btn-icon danger" title="Delete" onclick="deleteFlashcardSet('${s.id}')">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>`;
        }

        async function deleteFlashcardSet(id) {
            if (!confirm('Delete this flashcard set?')) return;
            try {
                await window.apiService.deleteFlashcardSet(id);
                document.getElementById(`flashcard-set-${id}`)?.remove();
                const list = document.getElementById('flashcards-list').querySelector('.history-list');
                if (list && !list.children.length) {
                    document.getElementById('flashcards-list').innerHTML = `
                        <div class="state-box">
                            <i class="fas fa-layer-group"></i>
                            <p>No flashcard sets yet. <a href="study-tools.html">Generate flashcards</a> to get started.</p>
                        </div>`;
                }
                const count = document.getElementById('flashcards-count');
                count.textContent = Math.max(0, parseInt(count.textContent) - 1);
            } catch (err) {
                alert('Delete failed: ' + err.message);
            }
        }

        // ── Utility ───────────────────────────────────────────────────────────

        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>
</body>

</html>
