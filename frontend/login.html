<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDERAX - Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="animated-bg">
            <div class="floating-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
                <div class="shape shape-4"></div>
                <div class="shape shape-5"></div>
            </div>
            <div class="particles" id="particles"></div>
        </div>

        <header class="header">
            <div class="nav-container">
                <div class="logo">
                    <div class="logo-icon">
                        <img src="https://i.imgur.com/nBy9at5.png" alt="PDERAX Logo" class="logo-img">
                    </div>
                    <div class="logo-text">
                        <span class="logo-primary">PDERAX</span>
                        <span class="logo-subtitle">AI Document Intelligence</span>
                    </div>
                </div>
                <nav class="nav-links" id="primary-navigation">
                    <a href="../index.html" class="nav-link" data-text="Analyzer">Analyzer</a>
                    <a href="features.html" class="nav-link" data-text="Features">Features</a>
                    <a href="pricing.html" class="nav-link" data-text="Pricing">Pricing</a>
                    <a href="documentation.html" class="nav-link" data-text="Docs">Docs</a>
                </nav>
                <div class="nav-actions">
                    <a class="nav-btn" href="login.html">
                        <i class="fas fa-user"></i>
                        Sign In
                    </a>
                </div>
                <button class="mobile-menu-btn" type="button" aria-label="Toggle navigation" aria-expanded="false"
                    aria-controls="primary-navigation">
                    <i class="fas fa-bars icon-open" aria-hidden="true"></i>
                    <i class="fas fa-times icon-close" aria-hidden="true"></i>
                </button>
            </div>
            <div class="mobile-nav-overlay" aria-hidden="true"></div>
        </header>

        <main class="main-content auth-page">
            <section class="upload-section" id="authSection">
                <div class="upload-container">
                    <div class="upload-card glass-card animate__animated animate__fadeIn">
                        <div class="upload-header">
                            <div class="upload-icon">
                                <i class="fas fa-shield-alt"></i>
                                <div class="icon-pulse"></div>
                            </div>
                            <h2>Welcome back</h2>
                            <p>Sign in, create an account, or continue with Google.</p>
                        </div>

                        <div class="auth-tabs">
                            <button class="auth-tab active" data-tab="login">Sign In</button>
                            <button class="auth-tab" data-tab="signup">Create Account</button>
                            <button class="auth-tab" data-tab="verify">Verify Email</button>
                        </div>

                        <div class="auth-panel" id="loginPanel">
                            <form id="loginForm" class="auth-form">
                                <label class="auth-label" for="loginEmail">Email</label>
                                <input class="auth-input" id="loginEmail" type="email" required>

                                <label class="auth-label" for="loginPassword">Password</label>
                                <input class="auth-input" id="loginPassword" type="password" required>

                                <button class="action-btn primary" type="submit">Sign In</button>
                            </form>
                        </div>

                        <div class="auth-panel" id="signupPanel" hidden>
                            <form id="signupForm" class="auth-form">
                                <label class="auth-label" for="signupEmail">Email</label>
                                <input class="auth-input" id="signupEmail" type="email" required>

                                <label class="auth-label" for="signupPassword">Password</label>
                                <input class="auth-input" id="signupPassword" type="password" minlength="8" required>

                                <button class="action-btn primary" type="submit">Create Account</button>
                            </form>
                        </div>

                        <div class="auth-panel" id="verifyPanel" hidden>
                            <form id="verifyForm" class="auth-form">
                                <label class="auth-label" for="verifyEmail">Email</label>
                                <input class="auth-input" id="verifyEmail" type="email" required>

                                <label class="auth-label" for="verifyCode">Verification Code</label>
                                <input class="auth-input" id="verifyCode" type="text" required>

                                <button class="action-btn primary" type="submit">Verify Email</button>
                                <button class="action-btn" type="button" id="resendCode">Resend Code</button>
                            </form>
                        </div>

                        <div class="auth-divider">
                            <span>Or continue with</span>
                        </div>

                        <a class="ghost-btn" id="googleLogin" href="#">
                            <i class="fab fa-google"></i>
                            Google
                        </a>

                        <div class="auth-message" id="authMessage"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
</body>

</html>
